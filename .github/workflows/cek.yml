name: cek
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: never-regress invariants
        run: bash scripts/invariants.sh
      - name: test workspace (unit + property tables)
        run: cargo test --workspace
      - name: vectors
        run: cargo run -p cek-cli -- vectors crates/cek-contract/vectors
      - name: TypeScript Peer apply-only
        run: node --experimental-strip-types --no-warnings ports/cek-peer-ts/src/run-vectors.ts crates/cek-contract/vectors
      - name: coverage inventory
        run: bash scripts/coverage.sh
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked || true
      - name: coverage summary
        run: cargo llvm-cov --workspace --summary-only || echo "llvm-cov optional"
