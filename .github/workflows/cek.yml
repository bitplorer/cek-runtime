name: cek
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: never-regress invariants
        run: bash scripts/invariants.sh
      - name: test workspace (unit + property tables)
        run: cargo test --workspace
      - name: vectors
        run: cargo run -p cek-cli -- vectors crates/cek-contract/vectors
      - name: TypeScript Peer apply-only
        run: node --experimental-strip-types --no-warnings ports/cek-peer-ts/src/run-vectors.ts crates/cek-contract/vectors
      - name: WASM Peer apply-only
        run: |
          rustup target add wasm32-unknown-unknown
          bash scripts/run-wasm-peer.sh
      - name: coverage inventory
        run: bash scripts/coverage.sh
      - name: llvm-cov HTML
        run: bash scripts/llvm-cov.sh
      - name: upload coverage html
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cek-coverage-html
          path: coverage/
          if-no-files-found: warn
